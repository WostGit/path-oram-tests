name: Path ORAM for Confidential AI - Exhaustive Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-oram:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
        block_size: [1024, 4096, 8192]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate
          pip install git+https://github.com/ghackebeil/PyORAM.git
          pip install pytest

      - name: Create test structure
        run: |
          mkdir -p tests results

      - name: Create conftest.py for custom arguments
        run: |
          cat > conftest.py << 'EOF'
          import pytest

          def pytest_addoption(parser):
              parser.addoption("--block-size", action="store", default=4096, type=int)
          EOF

      - name: Write test files
        run: |
          cat > tests/test_path_oram.py << 'EOF'
          import time
          import pytest
          import numpy as np
          from pyoram.oblivious_ram import PathORAM

          @pytest.fixture(scope="class")
          def oram_config(request):
              return {
                  'memory_size': 1_073_741_824,   # 1 GiB for 0.5B model simulation
                  'block_size': request.config.getoption("--block-size")
              }

          class TestPathORAM:
              def test_oram_initialization(self, oram_config, tmp_path):
                  oram_file = tmp_path / "test_oram.dat"
                  config = oram_config
                  num_blocks = config['memory_size'] // config['block_size']

                  start = time.time()
                  oram = PathORAM(
                      str(oram_file),
                      block_size=config['block_size'],
                      block_count=num_blocks,
                      stash_capacity=256,
                      recursion_depth=1
                  )
                  init_time = time.time() - start

                  assert oram is not None
                  print(f"✓ ORAM init OK (block_size={config['block_size']}, {init_time:.2f}s)")
                  oram.close()

              def test_random_access(self, oram_config, tmp_path):
                  config = oram_config
                  oram_file = tmp_path / "test_oram.dat"
                  num_blocks = config['memory_size'] // config['block_size']

                  oram = PathORAM(
                      str(oram_file),
                      block_size=config['block_size'],
                      block_count=num_blocks,
                      stash_capacity=512,
                      recursion_depth=1
                  )

                  num_accesses = 1000
                  start = time.time()

                  for _ in range(num_accesses):
                      addr = np.random.randint(0, num_blocks)
                      data = oram.read_block(addr)
                      oram.write_block(addr, data)

                  total = time.time() - start
                  avg_ms = (total / num_accesses) * 1000

                  print(f"✓ {num_accesses} accesses | Avg: {avg_ms:.1f}ms | Block size: {config['block_size']}")
                  assert avg_ms < 2500
                  oram.close()

          if __name__ == "__main__":
              pytest.main([__file__, "-q", "--tb=no"])
          EOF

          cat > tests/simulate_05b_inference.py << 'EOF'
          import time
          from transformers import AutoModelForCausalLM, AutoTokenizer
          import torch

          print("Running 0.5B model baseline on CPU...")
          model_name = "Qwen/Qwen2.5-0.5B"
          tokenizer = AutoTokenizer.from_pretrained(model_name)
          model = AutoModelForCausalLM.from_pretrained(model_name, torch_dtype=torch.float32, device_map="cpu")

          prompt = "What is Path ORAM?"
          inputs = tokenizer(prompt, return_tensors="pt")

          start = time.time()
          output = model.generate(**inputs, max_new_tokens=60, do_sample=False)
          elapsed = time.time() - start

          tps = 60 / elapsed
          print(f"✅ Baseline: {tps:.1f} tokens/sec on CPU")
          EOF

      - name: Run ORAM Tests
        run: |
          python -m pytest tests/test_path_oram.py --block-size=${{ matrix.block_size }} -q --tb=no

      - name: Run 0.5B Baseline Inference
        run: python tests/simulate_05b_inference.py

      - name: Save summary
        if: always()
        run: |
          mkdir -p results
          echo "Block Size: ${{ matrix.block_size }}" > results/summary.txt
          echo "Python: ${{ matrix.python-version }}" >> results/summary.txt
          echo "Finished: $(date)" >> results/summary.txt
