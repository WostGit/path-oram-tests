name: Path ORAM for Confidential AI - Exhaustive Test Suite

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-oram:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
        optimization: ['basic', 'medium', 'high']
        block_size: [1024, 4096, 8192]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate
          pip install git+https://github.com/ghackebeil/PyORAM.git
          pip install pytest

      - name: Create test files
        run: |
          mkdir -p tests results

          cat > tests/test_path_oram.py << 'EOF'
          import os
          import time
          import pytest
          import numpy as np
          from pyoram.oblivious_ram import PathORAM

          def pytest_addoption(parser):
              parser.addoption("--block-size", action="store", default=4096, type=int)
              parser.addoption("--opt-level", action="store", default="medium")

          @pytest.fixture(scope="class")
          def oram_config(request):
              return {
                  'memory_size': 1_073_741_824,
                  'block_size': request.config.getoption("--block-size"),
                  'optimization': request.config.getoption("--opt-level")
              }

          class TestPathORAM:
              def test_oram_initialization(self, oram_config, tmp_path):
                  oram_file = tmp_path / "test_oram.dat"
                  memory_size = oram_config['memory_size']
                  block_size = oram_config['block_size']
                  num_blocks = memory_size // block_size

                  start = time.time()
                  oram = PathORAM(
                      str(oram_file),
                      block_size=block_size,
                      block_count=num_blocks,
                      stash_capacity=256,
                      recursion_depth=1
                  )
                  init_time = time.time() - start

                  assert oram is not None
                  assert init_time < 45.0
                  oram.close()
                  print(f"✓ ORAM initialized (block_size={block_size}, {init_time:.2f}s)")

              def test_random_access_performance(self, oram_config, tmp_path):
                  oram_file = tmp_path / "test_oram.dat"
                  memory_size = oram_config['memory_size']
                  block_size = oram_config['block_size']
                  num_blocks = memory_size // block_size

                  oram = PathORAM(
                      str(oram_file),
                      block_size=block_size,
                      block_count=num_blocks,
                      stash_capacity=512,
                      recursion_depth=1
                  )

                  num_accesses = 1200
                  start = time.time()

                  for i in range(num_accesses):
                      addr = np.random.randint(0, num_blocks)
                      data = oram.read_block(addr)
                      oram.write_block(addr, data)

                  total_time = time.time() - start
                  avg_ms = (total_time / num_accesses) * 1000

                  print(f"Block size: {block_size} | Avg access: {avg_ms:.2f}ms")
                  assert avg_ms < 1500
                  oram.close()

          if __name__ == "__main__":
              pytest.main([__file__, "-q", "--tb=no"])
          EOF

          cat > tests/simulate_05b_inference.py << 'EOF'
          import time
          from transformers import AutoModelForCausalLM, AutoTokenizer
          import torch

          def run_baseline_inference():
              print("Loading Qwen2.5-0.5B (CPU)...")
              model_name = "Qwen/Qwen2.5-0.5B"
              
              tokenizer = AutoTokenizer.from_pretrained(model_name)
              model = AutoModelForCausalLM.from_pretrained(
                  model_name, torch_dtype=torch.float32, device_map="cpu"
              )
              
              prompt = "Explain confidential AI in one sentence."
              inputs = tokenizer(prompt, return_tensors="pt")
              
              start = time.time()
              generated = model.generate(**inputs, max_new_tokens=50, do_sample=False)
              total_time = time.time() - start
              
              tps = 50 / total_time
              print(f"Baseline: {tps:.1f} tokens/sec on CPU")
              return tps

          if __name__ == "__main__":
              run_baseline_inference()
          EOF

      - name: Run Path ORAM Tests
        run: |
          python -m pytest tests/test_path_oram.py \
            --block-size=${{ matrix.block_size }} \
            --opt-level=${{ matrix.optimization }} \
            -q --tb=no

      - name: Run 0.5B Model Baseline
        run: python tests/simulate_05b_inference.py

      - name: Save results
        if: always()
        run: |
          mkdir -p results
          echo "Python ${{ matrix.python-version }} | Opt: ${{ matrix.optimization }} | Block: ${{ matrix.block_size }}" > results/summary.txt
          echo "Completed: $(date)" >> results/summary.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oram-results-py${{ matrix.python-version }}-opt-${{ matrix.optimization }}
          path: results/
          retention-days: 7
